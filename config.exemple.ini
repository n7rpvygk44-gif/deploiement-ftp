; Modèle de configuration de deployer.py
; 1) Copie ce fichier : cp config.exemple.ini config.ini
; 2) Remplis config.ini (il est ignoré par Git : ton mot de passe ne sera jamais publié)

[git]
; Adresse du dépôt GitHub du portfolio
depot = https://github.com/n7rpvygk44-gif/portfolio-dashboard.git
; Branche à déployer
branche = main
; Copie locale du dépôt (créée par git clone si elle n'existe pas)
dossier_local = ~/Documents/portfolio-dashboard

[ftp]
hote = jv581s.ftp.infomaniak.com
port = 21
utilisateur = jv581s_olivier_
; Laisse vide : le script demandera le mot de passe à chaque lancement (le plus sûr).
mot_de_passe =
; Dossier du site sur le serveur
dossier_distant = /portfolio
; oui = FTPS (connexion chiffrée, recommandé) ; non = FTP simple
chiffrement = oui
; Secondes d'attente maximum d'une réponse du serveur
delai = 60

[envoi]
; Fichiers jamais envoyés (un motif par ligne ; * = n'importe quoi)
exclure =
    .git*
    .DS_Store
    Thumbs.db
    *.swp
    README.md
    docs/*
    dist/*
; Fichiers modifiés en ligne depuis /admin : envoyés seulement s'ils manquent sur le serveur
proteger =
    data/*.json
; oui = un fichier effacé dans Git est aussi effacé sur le serveur
supprimer_fichiers_effaces = oui
; Fichiers absents de Git (ignorés par .gitignore) mais nécessaires au site.
; data/admin.json = compte du backoffice /admin, créé sur le Mac avec : php bin/create-admin.php
; Envoyés seulement s'ils ont changé.
hors_git =
    data/admin.json

[racine]
; Hébergement de l'école : le site affiche le dossier « / » et on ne peut pas le changer.
; Ce .htaccess fait afficher portfolio/public/ et cache le code et les données.
; Laisse vide si l'hébergeur permet de choisir le dossier racine (ex. alwaysdata).
htaccess = infomaniak/htaccess-racine.txt
; Dossier FTP qui correspond à l'adresse du site
dossier = /
